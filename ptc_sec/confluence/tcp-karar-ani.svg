<text x="40" y="434" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#868e96" text-anchor="start" font-weight="400">kaydı üretebilir. Kayıt sayısı, deneme sayısı demek değildir.</text>
