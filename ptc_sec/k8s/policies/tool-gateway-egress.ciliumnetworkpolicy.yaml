# Tool Gateway'in kendi egress'i — "supporting service" ilkesi
# (PTC_Egress_Policy_OpenAI_Incident.md'nin dersi: agent'ın kısıtlı olması
# yetmez, agent'ın eriştiği servisin de kendi egress'i kısıtlanmalı).
#
# Tool Gateway'in TEK dış hedefi: .env'deki embedding/LLM gateway'i.
# Bkz. specs/002-ptc-code-sandbox/research.md §4.2.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tool-gateway-egress
spec:
  endpointSelector:
    matchLabels:
      app: tool-gateway
  egress:
  - toEndpoints: # DNS çözümlemesi için (FQDN kuralı DNS'e ihtiyaç duyar)
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      rules:
        dns:
        - matchPattern: "*"
  - toFQDNs:
    - matchName: "mia.csp.kloudeks.com"
    # tiktoken'ın cl100k_base varsayılan encoding tablosunu indirdiği adres
    # (langchain_openai, tiktoken'a tanıdık gelmeyen bir model adı — bizim
    # durumumuzda "Qwen3-Embedding-8B" — gördüğünde buna düşüyor). Bilinçli
    # olarak eklendi (2026-08-28, Altan'ın kararı) — bkz. plan.md "6. bulgu".
    # Dockerfile artık bu dosyayı build zamanında önceden gömüyor, bu yüzden
    # bu kural normal şartlarda hiç kullanılmaz — savunma amaçlı (defense in
    # depth) tutuluyor.
    - matchName: "openaipublic.blob.core.windows.net"
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
