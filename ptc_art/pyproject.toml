[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grounded-assistant"
version = "0.1.0"
description = "Faz 1: Kurumsal zemine-dayalı asistan PoC (PTC güvenlik araştırması)"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-openai",
    "langchain-mcp-adapters",
    "fastmcp",
    "rank_bm25",
    "numpy",
    "typer",
    "python-dotenv",
    "rich",
    "kubernetes",
    "fastapi",
    "uvicorn[standard]",
    # Aşağıdakiler HOST tarafında da doğrudan import ediliyor; sandbox/sidecar
    # imajlarında ayrıca kurulu olmaları burada bildirilmemeleri anlamına
    # gelmiyordu — temiz bir kurulumda eksik kalıyorlardı (2026-09-09).
    "requests",      # artifact_context, konsol, durum, artifact_bak
    "minio",         # artifacts/store.py
    "pandas",        # artifacts/serialize.py, konsol, artifact_bak
    "pyarrow",       # artifacts/serialize.py — Parquet
    "matplotlib",    # konsol demo kodu, kabul_testi
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
assistant = "grounded_assistant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_assistant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
