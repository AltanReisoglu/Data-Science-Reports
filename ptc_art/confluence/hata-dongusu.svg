<text x="548" y="226" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e03131" text-anchor="start">✗ hata</text>
<text x="535" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle">1 · NE GERİ</text>
<text x="535" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle">VERİLİYOR</text>
<text x="672" y="279" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#868e96" text-anchor="start">tip · satır · kaynak satırı</text>
<text x="672" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#868e96" text-anchor="start">stdout · çıkış kodu</text>
<text x="672" y="325" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e03131" text-anchor="start">darboğaz burası</text>
<text x="535" y="448" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle">2 · KAÇ DENEME</text>
<text x="672" y="423" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#868e96" text-anchor="start">sebebe göre ayrı bütçe</text>
