<text x="40" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start">Hata kurtarma döngüsü — üç karar noktası</text>
<text x="40" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#868e96" text-anchor="start">Kod patlayınca sistem üç soruyu sırayla cevaplamak zorunda.</text>
