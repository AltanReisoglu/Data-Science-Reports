<text x="40" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#868e96" text-anchor="start">Pipeline dünyasında soru hiç doğmuyor: DAG'ı insan yazıyor, girdi bağlanmış geliyor.</text>
