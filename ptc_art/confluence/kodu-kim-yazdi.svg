<rect x="580" y="426" width="540" height="118" rx="8" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="8 6"/>
<text x="20" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start">Aracıyı nereye koymalı?</text>
<text x="22" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#757575" text-anchor="start">Cevap, sandbox'taki kodu kimin yazdığına bağlı</text>
<text x="160" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">Geliştirici</text>
<text x="160" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">review'dan geçmiş, git'te</text>
<text x="491" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">A ya da B</text>
<text x="491" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">mount · sarmalayıcı</text>
<text x="630" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start">Korunacak bir şey yok; mount ve sarmalayıcı en rahat yol.</text>
<text x="630" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start">Kendi belgesinde böyle varsayan: KFP, Databricks</text>
<text x="160" y="233" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">Son kullanıcı</text>
<text x="160" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">SaaS'ta keyfi kod</text>
<text x="491" y="233" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">C · sınır</text>
<text x="491" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">taşıyıcı kodun dışında</text>
<text x="630" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start">Kod düşman varsayılır; taşıyıcı kodun erişemeyeceği</text>
<text x="630" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start">bir güven alanında durmalı.</text>
<text x="160" y="337" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">LLM</text>
<text x="160" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">her çalıştırmada yeni kod</text>
<text x="491" y="337" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">C · sınır</text>
<text x="491" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">taşıyıcı kodun dışında</text>
<text x="630" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start">Aynısı, bir fazlası: denetlenecek sabit bir yüzey yok.</text>
<text x="630" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start">Sahadaki örnek: Anthropic ve OpenAI code interpreter</text>
<text x="290" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">Kodu güvenilir varsayan iki ürün, kendi belgesiyle:</text>
<text x="290" y="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">Databricks — "Customers are responsible</text>
<text x="290" y="487" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">for running only trusted code"</text>
<text x="290" y="505" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">KFP — launcher kullanıcı container'ında,</text>
<text x="290" y="522" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">depo anahtarı kodun yanında</text>
<text x="850" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">OpenShift'in yerleşik desenleri A ve B ailesinde:</text>
<text x="850" y="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">KFP → sarmalayıcı · Tekton workspace → PVC.</text>
<text x="850" y="487" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">Güvenilmeyen kod için C ailesinden birinci-parti</text>
<text x="850" y="505" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">artifact cevabı yok — Agent Sandbox (TP)</text>
<text x="850" y="522" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">izolasyonu çözüyor, artifact'i değil.</text>
</svg>