<text x="40" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#868e96" text-anchor="start">Beyan aynı zamanda SOYU tanımlıyor: beyan edilen girdi, çıktının ebeveyni.</text>
