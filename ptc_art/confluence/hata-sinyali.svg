<text x="230" y="39" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start">Hata sinyalinin üç parçası</text>
<text x="122" y="153" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1e1e1e" text-anchor="middle">kod patlar</text>
<text x="398" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">① ne oldu</text>
<text x="398" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">② ne yapmıştı</text>
<text x="398" y="171" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">③ ne yapmalı</text>
<text x="680" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle">model DÜZELTİR</text>
<text x="265" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#15803d" text-anchor="start">① NE OLDU        hata tipi + patlayan satırın kaynağı</text>
<text x="265" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#15803d" text-anchor="start">② NE YAPMIŞTI    hata anına kadar basılan çıktı</text>
<text x="265" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#b45309" text-anchor="start">③ NE YAPMALI     talimat — çoğu üründe eksik olan parça</text>
<text x="58" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#b45309" text-anchor="start">KIRPMA — iki ayrıntı</text>
<text x="58" y="388" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start">Kırpıldığı SÖYLENMELİ</text>
<text x="58" y="411" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#757575" text-anchor="start">sessiz kırpma, eksiği tam sandırır</text>
<text x="58" y="442" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start">NEREDEN kırpıldığı belirleyici</text>
<text x="58" y="465" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#757575" text-anchor="start">hata en sondaysa baştan kesme onu yer</text>
<text x="428" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#b91c1c" text-anchor="start">HER HATA AYNI DEĞİL</text>
<text x="428" y="391" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start">KeyError          düzeltilebilir  →  yeniden dene</text>
<text x="428" y="421" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start">ConnectionError   ağ kapalıysa    →  denemek boşuna</text>
<text x="428" y="459" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#757575" text-anchor="start">Bütçeyi hatanın SEBEBİNE göre ayır</text>
</svg>