<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kurumsal Asistan</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css"
  />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-top">
        <h1>Kurumsal Asistan</h1>
        <span class="connection-dot" id="connection-dot" title="Bağlantı durumu"></span>
        <a class="durum-link" href="/durum" title="Artifact deposu, veri akışı ve çalıştırmalar">Artifact deposu →</a>
      </div>
      <p class="subtitle">Sandbox her çalıştırmada ölür; ürettiği kalır — <code>/output</code>'a yazılan her şey artifact olur</p>
    </header>

    <main class="app-main">
      <form id="question-form" class="question-form">
        <input
          type="text"
          id="question-input"
          placeholder="Bir soru sorun..."
          autocomplete="off"
          required
        />
        <button type="submit" id="submit-button">
          <span class="button-label">Gönder</span>
          <span class="spinner" hidden></span>
        </button>
      </form>

      <div id="example-chips" class="example-chips">
        <button
          type="button"
          class="chip"
          data-question="200 satırlık örnek ticket verisi üret (departman, cozum_saati), departmana göre ortalama çözüm süresini hesapla, hem ham tabloyu hem özeti sakla."
        >
          1 · Veri üret ve sakla
        </button>
        <button
          type="button"
          class="chip"
          data-question="Az önce sakladığın özette en yüksek ortalamaya sahip departman hangisi? Veriyi YENİDEN ÜRETME, sakladığından oku."
        >
          2 · Yeniden üretmeden oku
        </button>
        <button
          type="button"
          class="chip"
          data-question="Sakladığın özetten bir çubuk grafik çiz ve tek sayfalık bir PDF rapora dök."
        >
          3 · PDF rapor üret
        </button>
        <button
          type="button"
          class="chip"
          data-question="/output ve /artifacts altında neler var? Listele ve her birinin ne olduğunu kısaca söyle."
        >
          Depoda ne var?
        </button>
        <button
          type="button"
          class="chip"
          data-question="/output altına çok dosyalı bir model dizini bırak: model.v1/weights.json, model.v1/schema.json ve model.v1/alt/notlar.txt."
        >
          Çok dosyalı dizin çıktısı
        </button>
        <button type="button" class="chip" data-question="Şu an açık kritik ticket sayısı kaç?">
          Basit tool çağrısı
        </button>
      </div>

      <div id="chat" class="chat"></div>
    </main>
  </div>

  <!-- T004/T014 — sol-alt "PTC yaşam döngüsü" paneli (spec.md US2) -->
  <div id="ptc-panel" class="ptc-panel">
    <div class="ptc-panel-header" id="ptc-panel-header">
      <div class="traffic-lights">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <span class="ptc-panel-title">PTC Yaşam Döngüsü</span>
      <span class="ptc-panel-toggle" id="ptc-panel-toggle">‒</span>
    </div>
    <div id="ptc-panel-log" class="ptc-panel-log">
      <div class="line info">Bir PTC çalıştırması tetiklendiğinde burada canlı akacak…</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
