# Kapsam jetonu imza anahtarı — YEREL GELİŞTİRME DEĞERİ.
#
# Bu sır iki tarafta bulunur:
#   - Tool Gateway  : jetonu DOĞRULAR   (envFrom, k8s/tool-gateway/deployment.yaml)
#   - sandbox_runner: jetonu İMZALAR    (cluster API'siyle okur)
#
# Sandbox pod'una ASLA verilmez. Sandbox'ın eline yalnızca imzalanmış jeton
# geçer; o jetonu okuyabilir ama BAŞKA bir workflow için geçerli bir jeton
# üretemez. Capability modelinin kuralı: yetki taklit edilemez bir referansla
# taşınır, sahibi onu zayıflatabilir ama güçlendiremez.
#
# ÜRETİMDE: bu dosyayı kullanmayın. Anahtarı imperative üretin ve rotasyona
# tabi tutun:
#
#   oc create secret generic ptc-scope-signing \
#     --from-literal=PTC_SCOPE_SIGNING_KEY="$(openssl rand -hex 32)"
#
apiVersion: v1
kind: Secret
metadata:
  name: ptc-scope-signing
  labels: {app: ptc-artifacts}
type: Opaque
stringData:
  PTC_SCOPE_SIGNING_KEY: "yerel-gelistirme-anahtari-uretimde-degistir"
